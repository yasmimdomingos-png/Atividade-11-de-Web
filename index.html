<!DOCTYPE html>

<html>

    <head>
        <tittle>Atividade 11</tittle>
    </head>

    <body>
        <main>
            <h1>
                Exemplo de uso das tags &lt;figure&gt; e &lt;figcaption&gt;
            </h1>

            <section>
                <figure>
                    <img src="https://placehold.co/300x200/" alt="Exemplo de imagem com legenda">

                    <figcaption>Figura 1: Exemplo de uma imagem com legenda explicativa utilizando
                    as tags &lt;figure&gt; e &lt;figurecaption&gt;.</figcaption>
                </figure>
            </section>

            <section>
                <figure>
                    <figcaption>Figura 2: Diagrama mostrando a estrutura de um documento HTML.</figcaption>

                    <img src="https://placehold.co/300x200/" alt="Diagrama da estrutura HTML">
                </figure>
            </section>
            
        </main>
    </body>

</html>
